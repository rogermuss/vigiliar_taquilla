name: Vigilar taquilla Racing

on:
  schedule:
    # Cada 5 minutos (mínimo permitido), evitando el minuto :00 que va más saturado
    - cron: "2-59/5 * * * *"
  workflow_dispatch:   # botón "Run workflow" para probar a mano (envía un mensaje de prueba)

concurrency:
  group: vigilar-taquilla
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Recuperar el estado de la ejecución anterior
        uses: actions/cache@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: |
            estado-

      - name: Revisar la taquilla
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_github.py ${{ github.event_name == 'workflow_dispatch' && '--prueba' || '' }}
